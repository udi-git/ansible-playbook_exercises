---

- hosts: all
  become: yes 
  tasks:
    - name: install python3, python-pip
      package:
        name:
          - python3
          - python3-pip
        state: present      
  
    - name: install flask via pip (Ubuntu)
      pip:
        name: flask
        state: present
        extra_args: --break-system-packages
      when: ansible_os_family == "Debian"

    - name: install flask via pip (Centos)  
      pip:
        name: flask
        state: present
      when: ansible_os_family == "RedHat"

    - name: Create flask application code
      copy:
        dest: /home/udi_saada/app.py
        content: |
          from flask import Flask
          app = Flask(__name__)
          
          @app.route('/')
          def hello():
              return 'Hello from Flask app'
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000) 

    - name: Create systemd service for Flask
      copy:
        dest: /etc/systemd/system/flask.service
        content: |
          [Unit]
          Description=Flask Application Service
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/home/udi_saada
          ExecStart=/usr/bin/python3 /home/udi_saada/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Flask service
      systemd:
        name: flask
        state: started
        enabled: yes
        daemon_reload: yes

